services:
  feedback:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8787:8787" # 手机要访问时改成 "8787:8787"，并在 .env 填 PUBLIC_URL
    volumes:
      - feedback-data:/app/data
    stop_grace_period: 20s
volumes:
  feedback-data:
